# Render Blueprint — Web Service (backend API)
# Dashboard: set Root Directory to "backend" if deploying from monorepo root.
services:
  - type: web
    name: pms-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_ANALYTICS_URL
        value: https://pms-price-ai.onrender.com
      - key: DEAD_PLOT_AI_URL
        value: https://pms-dead-plot.onrender.com
      - key: DEAD_PLOT_AI_TIMEOUT_MS
        value: "45000"
      - key: ADMIN_ASSISTANT_URL
        value: https://pms-admin-assistant.onrender.com
      - key: ADMIN_ASSISTANT_TIMEOUT_MS
        value: "45000"
